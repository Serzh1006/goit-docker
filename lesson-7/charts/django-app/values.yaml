image:
  repository: 680528875447.dkr.ecr.eu-central-1.amazonaws.com/django-app
  tag: latest
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 8000

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

config:
  DJANGO_DEBUG: "False"
  DJANGO_SECRET_KEY: "super-secret-key"
  DJANGO_ALLOWED_HOSTS: "*"
